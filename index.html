<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내일 날씨 예보</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .location {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }

        .title {
            font-size: 32px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .date {
            font-size: 14px;
            color: #999;
        }

        .weather-main {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin: 30px 0;
            padding: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            color: white;
        }

        .weather-icon {
            font-size: 80px;
        }

        .weather-info {
            flex: 1;
            text-align: center;
        }

        .temperature {
            font-size: 56px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .weather-desc {
            font-size: 18px;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .feels-like {
            font-size: 14px;
            opacity: 0.8;
        }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 30px 0;
        }

        .detail-item {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .detail-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .detail-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .hourly-forecast {
            margin-top: 30px;
        }

        .hourly-title {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }

        .hourly-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .hourly-item {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            min-width: 80px;
            flex-shrink: 0;
        }

        .hourly-time {
            font-size: 12px;
            color: #999;
            margin-bottom: 8px;
        }

        .hourly-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .hourly-temp {
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }

        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .api-note {
            background: #e3f2fd;
            color: #1565c0;
            padding: 15px;
            border-radius: 10px;
            font-size: 12px;
            margin-top: 20px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="content"></div>
    </div>

    <script>
        const API_KEY = 'YOUR_OPENWEATHER_API_KEY'; // 여기에 API 키를 입력하세요
        const LATITUDE = 37.5665; // 서울 위도
        const LONGITUDE = 126.9780; // 서울 경도

        // 날씨 아이콘 매핑
        const weatherIcons = {
            '01d': '☀️',
            '01n': '🌙',
            '02d': '⛅',
            '02n': '☁️',
            '03d': '☁️',
            '03n': '☁️',
            '04d': '☁️',
            '04n': '☁️',
            '09d': '🌧️',
            '09n': '🌧️',
            '10d': '🌧️',
            '10n': '🌧️',
            '11d': '⛈️',
            '11n': '⛈️',
            '13d': '❄️',
            '13n': '❄️',
            '50d': '🌫️',
            '50n': '🌫️'
        };

        // 내일 날씨 데이터 가져오기
        async function fetchTomorrowWeather() {
            const contentDiv = document.getElementById('content');

            try {
                contentDiv.innerHTML = '<div class="loading"><div class="loading-spinner"></div><p>날씨 데이터를 불러오는 중...</p></div>';

                if (API_KEY === 'YOUR_OPENWEATHER_API_KEY') {
                    showSampleData();
                    return;
                }

                const response = await fetch(
                    `https://api.openweathermap.org/data/2.5/forecast?lat=${LATITUDE}&lon=${LONGITUDE}&units=metric&lang=ko&appid=${API_KEY}`
                );

                if (!response.ok) {
                    throw new Error('API 요청 실패');
                }

                const data = await response.json();
                displayWeather(data);
            } catch (error) {
                contentDiv.innerHTML = `
                    <div class="error">
                        <p>❌ 날씨 데이터를 불러올 수 없습니다.</p>
                        <p style="font-size: 12px; margin-top: 10px;">${error.message}</p>
                        <p style="font-size: 12px; margin-top: 10px;">API 키를 확인해주세요.</p>
                    </div>
                `;
                showSampleData();
            }
        }

        // 샘플 데이터 표시 (API 키가 없을 때)
        function showSampleData() {
            const contentDiv = document.getElementById('content');
            const sampleData = {
                city: { name: '서울' },
                list: generateSampleForecast()
            };
            displayWeather(sampleData, true);
        }

        // 샘플 예보 데이터 생성
        function generateSampleForecast() {
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            tomorrow.setHours(0, 0, 0, 0);

            const list = [];
            for (let i = 0; i < 8; i++) {
                const time = new Date(tomorrow);
                time.setHours(time.getHours() + i * 3);
                list.push({
                    dt: Math.floor(time.getTime() / 1000),
                    main: {
                        temp: 15 + Math.random() * 8,
                        feels_like: 14 + Math.random() * 8,
                        humidity: 50 + Math.random() * 30,
                        pressure: 1013 + Math.random() * 10
                    },
                    weather: [{
                        icon: Object.keys(weatherIcons)[Math.floor(Math.random() * 3)],
                        main: '구름',
                        description: '약간의 구름'
                    }],
                    wind: {
                        speed: 3 + Math.random() * 4
                    },
                    visibility: 10000
                });
            }
            return list;
        }

        // 날씨 표시
        function displayWeather(data, isSample = false) {
            const contentDiv = document.getElementById('content');
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            tomorrow.setHours(0, 0, 0, 0);

            // 내일 데이터 필터링
            const tomorrowData = data.list.filter(item => {
                const itemDate = new Date(item.dt * 1000);
                itemDate.setHours(0, 0, 0, 0);
                return itemDate.getTime() === tomorrow.getTime();
            });

            if (tomorrowData.length === 0) {
                contentDiv.innerHTML = '<div class="error"><p>내일 날씨 데이터를 찾을 수 없습니다.</p></div>';
                return;
            }

            // 내일의 최고/최저 기온 계산
            const temps = tomorrowData.map(item => item.main.temp);
            const maxTemp = Math.max(...temps);
            const minTemp = Math.min(...temps);

            // 평균 습도, 풍속
            const avgHumidity = Math.round(tomorrowData.reduce((sum, item) => sum + item.main.humidity, 0) / tomorrowData.length);
            const avgWind = (tomorrowData.reduce((sum, item) => sum + item.wind.speed, 0) / tomorrowData.length).toFixed(1);

            // 가장 가능성 높은 날씨
            const mainWeather = tomorrowData[0].weather[0];
            const weatherIcon = weatherIcons[mainWeather.icon] || '🌤️';

            const dateStr = tomorrow.toLocaleDateString('ko-KR', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                weekday: 'long'
            });

            const dayStr = tomorrow.toLocaleDateString('ko-KR', { weekday: 'long' });

            let html = `
                <div class="header">
                    <div class="location">📍 ${data.city.name}</div>
                    <div class="title">내일 날씨</div>
                    <div class="date">${dayStr}, ${tomorrow.getDate()}일</div>
                </div>

                <div class="weather-main">
                    <div class="weather-icon">${weatherIcon}</div>
                    <div class="weather-info">
                        <div class="temperature">${Math.round(maxTemp)}°C</div>
                        <div class="weather-desc">${mainWeather.description}</div>
                        <div class="feels-like">최저: ${Math.round(minTemp)}°C</div>
                    </div>
                </div>

                <div class="details-grid">
                    <div class="detail-item">
                        <div class="detail-label">습도</div>
                        <div class="detail-value">${avgHumidity}%</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">풍속</div>
                        <div class="detail-value">${avgWind} m/s</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">최고기온</div>
                        <div class="detail-value">${Math.round(maxTemp)}°C</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">최저기온</div>
                        <div class="detail-value">${Math.round(minTemp)}°C</div>
                    </div>
                </div>

                <div class="hourly-forecast">
                    <div class="hourly-title">시간별 날씨</div>
                    <div class="hourly-container">
            `;

            tomorrowData.forEach(item => {
                const itemTime = new Date(item.dt * 1000);
                const timeStr = itemTime.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
                const icon = weatherIcons[item.weather[0].icon] || '🌤️';
                html += `
                    <div class="hourly-item">
                        <div class="hourly-time">${timeStr}</div>
                        <div class="hourly-icon">${icon}</div>
                        <div class="hourly-temp">${Math.round(item.main.temp)}°C</div>
                    </div>
                `;
            });

            html += `
                    </div>
                </div>
            `;

            if (isSample) {
                html += `
                    <div class="api-note">
                        ℹ️ <strong>샘플 데이터로 표시 중입니다.</strong> 
                        <br>실시간 데이터를 보려면 <a href="https://openweathermap.org/api" target="_blank">OpenWeather API</a>에서 API 키를 받으신 후, 
                        이 파일의 <code>API_KEY</code> 변수를 업데이트하세요.
                    </div>
                `;
            }

            contentDiv.innerHTML = html;
        }

        // 페이지 로드 시 실행
        document.addEventListener('DOMContentLoaded', fetchTomorrowWeather);
    </script>
</body>
</html>
